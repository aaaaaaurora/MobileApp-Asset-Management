# --- 1. SPAZIO DISCO PER LE CODE (PERSISTENZA) ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
# --- 2. IL SERVER MESSAGE BROKER (DEPLOYMENT) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        # L'immagine con il tag "-management" include l'interfaccia web
        image: rabbitmq:3-management
        ports:
        - containerPort: 5672  # Porta standard per il protocollo AMQP (usata dai microservizi)
        - containerPort: 15672 # Porta per l'interfaccia grafica Web di gestione
        
        env:
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: rabbitmq-user
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: rabbitmq-password
        
        volumeMounts:
        - name: rabbitmq-storage
          mountPath: /var/lib/rabbitmq # Cartella dove RabbitMQ salva i dati delle code persistenti

      volumes:
      - name: rabbitmq-storage
        persistentVolumeClaim:
          claimName: rabbitmq-pvc

---
# --- 3. I SERVIZI DI RETE (SERVICE) ---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
  namespace: default
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      protocol: TCP
      port: 5672
      targetPort: 5672
    - name: management
      protocol: TCP
      port: 15672
      targetPort: 15672
  type: ClusterIP