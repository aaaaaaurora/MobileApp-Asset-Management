apiVersion: apps/v1
kind: Deployment
metadata:
  name: warning-deployment
  namespace: default
spec:
  replicas: 1 
  selector:
    matchLabels:
      app: warning-service
  template:
    metadata:
      labels:
        app: warning-service
    spec:
      containers:
      - name: warning-service
        image: claudia179/warning-service-img:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        
        # --- CONFIGURAZIONE AMBIENTE ---
        env:
        - name: PORT
          value: "5000"
        
        # 1. URL DEL DATABASE RELAZIONALE (PostgreSQL - warning_db)
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: warning-db-url
        
        # 2. CHIAVE DI SICUREZZA JWT (Per autorizzare le azioni in base al ruolo)
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: jwt-secret

        # 3. COLLEGAMENTO AL MESSAGE BROKER (Per notificare gli eventi di chiusura ticket)
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: rabbitmq-url

---
apiVersion: v1
kind: Service
metadata:
  name: warning-service
  namespace: default
spec:
  selector:
    app: warning-service
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: ClusterIP