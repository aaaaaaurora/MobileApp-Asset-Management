apiVersion: apps/v1
kind: Deployment
metadata:
  name: asset-deployment
  namespace: default
spec:
  replicas: 2 # Active Redundancy per gestire il carico delle operazioni di censimento
  selector:
    matchLabels:
      app: asset-service
  template:
    metadata:
      labels:
        app: asset-service
    spec:
      containers:
      - name: asset-service
        image: claudia179/asset-service-img:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        
        # --- CONFIGURAZIONE AMBIENTE ---
        env:
        - name: PORT
          value: "5000"
        
        # 1. URL DEL DATABASE MONGODB
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: asset-db-url
        
        # 2. CHIAVE DI SICUREZZA JWT
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: jwt-secret

        # 3. COLLEGAMENTO AL MESSAGE BROKER 
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: rabbitmq-url

---
apiVersion: v1
kind: Service
metadata:
  name: asset-service
  namespace: default
spec:
  selector:
    app: asset-service
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: ClusterIP